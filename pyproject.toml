[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentdown"
version = "0.1.0"
description = "The terminal companion for AI coding agents — renders the plans, checklists, and docs tools like Claude Code, Codex, and Antigravity write."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "rich>=13",
]

[project.scripts]
agentdown = "agentdown.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdown"]
